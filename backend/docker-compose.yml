services:
  shorturl:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: shorturl

    ports:
      - "8080:8080"

    environment:
      DB_URL: jdbc:h2:file:/app/data/shorturl
      DB_DRIVER: org.h2.Driver
      DB_USERNAME: sa
      DB_PASSWORD: ""
      DDL_AUTO: update
      SHOW_SQL: "false"
      H2_CONSOLE_ENABLED: "true"
      SERVER_PORT: "8080"

    volumes:
      - h2-data:/app/data

    restart: unless-stopped

volumes:
  h2-data: